<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Autenticação Mercado Pago</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #121214;
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      width: 48px;
      height: 48px;
      border-radius: 50%;
      border-left-color: #009EE3;
      animation: spin 1s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    h2 { margin-bottom: 8px; font-weight: 600; }
    p { color: #A1A1AA; font-size: 14px; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h2>Conectando com Mercado Pago...</h2>
  <p>Por favor aguarde, estamos concluindo a autorização.</p>

  <script>
    (function() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const state = urlParams.get('state');
      const error = urlParams.get('error');

      const messagePayload = {
        type: 'MERCADO_PAGO_OAUTH',
        code: code,
        state: state,
        error: error
      };

      if (window.opener) {
        window.opener.postMessage(messagePayload, '*');
        setTimeout(function() {
          window.close();
        }, 1200);
      } else {
        if (code) {
          window.location.href = '/?mp_code=' + encodeURIComponent(code);
        }
      }
    })();
  </script>
</body>
</html>
